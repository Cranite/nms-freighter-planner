<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- Page title shown in browser tab -->
  <title>No Man's Sky Freighter Planner</title>

  <!-- Main stylesheet -->
  <link rel="stylesheet" href="style.css">

  <!-- PIXI.js rendering engine (GPU accelerated canvas).
       Pinned version + integrity hash: the browser refuses the file if it ever differs. -->
  <script src="https://cdn.jsdelivr.net/npm/pixi.js@7.4.3/dist/pixi.min.js"
          integrity="sha384-WVl0NBPVrXQHe0ibelECk5mPNUeme+2xVETxTzCdadGWyMDQxkqadnrd+yLqd4yg"
          crossorigin="anonymous"></script>
</head>
<body>
  <!-- Sidebar UI (controls, module selection, save/load) -->
  <div id="ui">
    <h1>Freighter Planner</h1>

    <!-- Floor selection dropdown -->
    <label>Floor:
      <select id="floorSelect"></select>
    </label>

    <!-- Onion skin: show neighbouring floors for reference -->
    <div class="onion-skin">
      <label><input type="checkbox" id="onionBelow"> Show floor below</label>
      <label><input type="checkbox" id="onionAbove"> Show floor above</label>
    </div>

    <!-- Whole-floor tools (paste and clear are undoable) -->
    <div class="button-row">
      <button id="copyFloorBtn" title="Copy this floor">Copy</button>
      <button id="pasteFloorBtn" title="Copy a floor first" disabled>Paste</button>
      <button id="clearFloorBtn" title="Remove everything on this floor">Clear</button>
    </div>
    <p id="copiedFloor" class="hint"></p>

    <!-- Undo/redo -->
    <div class="button-row">
      <button id="undoBtn" title="Undo (Ctrl+Z)">↶ Undo</button>
      <button id="redoBtn" title="Redo (Ctrl+Y / Ctrl+Shift+Z)">↷ Redo</button>
    </div>

    <!-- Validation problems (filled by ui.js); click one to go to its floor -->
    <div id="problems" aria-live="polite"></div>

    <!-- Module palette (dynamically populated) -->
    <h3>Modules</h3>
    <input type="search" id="moduleSearch" placeholder="Search modules…" aria-label="Search modules">
    <div id="modulePalette"></div>

    <hr>

    <!-- Persistence controls. Current work is auto-saved; Save/Load is a manual checkpoint -->
    <p class="hint">Your work is saved automatically in this browser.</p>
    <button id="newBtn">🗒️ New layout</button>
    <button id="saveBtn" title="Store a checkpoint you can return to with Load">💾 Save checkpoint</button>
    <button id="loadBtn" title="Return to the last saved checkpoint">📂 Load checkpoint</button>

    <!-- File export/import (JSON) -->
    <button id="exportBtn">⬇️ Export file</button>
    <button id="importBtn">⬆️ Import file</button>
    <input type="file" id="importInput" accept=".json,application/json" hidden>

    <!-- Controls overview -->
    <h3>Controls</h3>
    <ul id="controls">
      <li><span>Place module</span> <span><kbd>Click</kbd> / drag</span></li>
      <li><span>Remove</span> <span><kbd>Right</kbd> / <kbd>Shift</kbd> + click</span></li>
      <li><span>Pick from tile</span> <span><kbd>Middle</kbd> / <kbd>Alt</kbd> + click</span></li>
      <li><span>Rotate stairs</span> <kbd>R</kbd></li>
      <li><span>Undo / redo</span> <span><kbd>Ctrl</kbd>+<kbd>Z</kbd> / <kbd>Y</kbd></span></li>
      <li><span>Zoom</span> <kbd>Scroll</kbd></li>
      <li><span>Pan</span> <span><kbd>Middle</kbd> drag</span></li>
    </ul>
  </div>

  <!-- PIXI canvas is injected here -->
  <div id="canvasContainer"></div>

  <!-- Entry point (ES module) -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
