<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- Page title shown in browser tab -->
  <title>No Man's Sky Freighter Planner</title>

  <!-- Main stylesheet -->
  <link rel="stylesheet" href="style.css">

  <!-- PIXI.js rendering engine (GPU accelerated canvas).
       Pinned version + integrity hash: the browser refuses the file if it ever differs. -->
  <script src="https://cdn.jsdelivr.net/npm/pixi.js@7.4.3/dist/pixi.min.js"
          integrity="sha384-WVl0NBPVrXQHe0ibelECk5mPNUeme+2xVETxTzCdadGWyMDQxkqadnrd+yLqd4yg"
          crossorigin="anonymous"></script>
</head>
<body>
  <!-- Sidebar UI (controls, module selection, save/load) -->
  <div id="ui">
    <h1>Freighter Planner</h1>

    <!-- Floor selection dropdown -->
    <label>Floor:
      <select id="floorSelect"></select>
    </label>

    <!-- Undo/redo -->
    <div class="button-row">
      <button id="undoBtn" title="Undo (Ctrl+Z)">↶ Undo</button>
      <button id="redoBtn" title="Redo (Ctrl+Y / Ctrl+Shift+Z)">↷ Redo</button>
    </div>

    <!-- Module palette (dynamically populated) -->
    <h3>Modules</h3>
    <input type="search" id="moduleSearch" placeholder="Search modules…" aria-label="Search modules">
    <div id="modulePalette"></div>

    <hr>

    <!-- Persistence controls -->
    <button id="saveBtn">💾 Save</button>
    <button id="loadBtn">📂 Load</button>

    <!-- File export/import (JSON) -->
    <button id="exportBtn">⬇️ Export file</button>
    <button id="importBtn">⬆️ Import file</button>
    <input type="file" id="importInput" accept=".json,application/json" hidden>

    <!-- UX hint -->
    <p>Scroll to zoom, click or drag to place module.</p>
  </div>

  <!-- PIXI canvas is injected here -->
  <div id="canvasContainer"></div>

  <!-- Entry point (ES module) -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
